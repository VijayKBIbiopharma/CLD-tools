[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cld-vector"
version = "0.1.0"
description = "Vector selection for biologics programmes: the Python port of the CLD Tools vector bench"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cld-vector = "cld_vector.cli:main"

[tool.setuptools]
packages = ["cld_vector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
