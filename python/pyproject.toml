[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boss-vector"
version = "0.1.0"
description = "Vector selection for biologics programmes: the Python port of the BOSS vector bench"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
boss-vector = "boss_vector.cli:main"

[tool.setuptools]
packages = ["boss_vector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
